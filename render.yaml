services:
  - type: web
    name: ai-project-architect
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: architect-db
          property: connectionString
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: HUGGINGFACE_EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: HUGGINGFACE_API_KEY
        sync: false
databases:
  - name: architect-db
    plan: basic-256mb
    databaseName: architect
    user: architect